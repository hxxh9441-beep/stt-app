# ===== النشر التلقائي على GitHub Pages =====
# يعمل تلقائياً عند أي Push إلى main (أو master)، ويدعم التشغيل اليدوي.
#
# خطوات التفعيل (مرة واحدة في إعدادات المستودع):
#   Settings → Pages → Source: "GitHub Actions"
#
# ملاحظة: GitHub Pages لا يدعم ترويسات HTTP مخصصة (COOP/COEP) —
# وضع التوليد الفائق (WebGPU) يتطلبها، لذا سيعمل التطبيق تلقائياً
# بوضع التوليد القياسي (WASM) على GitHub Pages — وهو مستقر وأوفلاين.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# صلاحيات النشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# منع تداخل النشرات المتزامنة — الأحدث يلغي الجاري
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
